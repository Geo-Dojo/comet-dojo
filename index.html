<style>
@font-face{font-family:"Bricolage Grotesque";font-weight:200 800;font-display:swap;src:url(fonts/bricolage.woff2) format("woff2")}
:root{color-scheme:dark;--bg:#0a0414;--panel:#150828;--edge:#4b2a63;--inkline:#05020c;--c1:#3fd8f2;--c2:#ff5fd8;--gold:#ffd23f;--coral:#ff7158;--mint:#5ff0a8;--ink:#f4ecff;--mut:#bba9cf;--bad:#ff4f7b;--font:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif}

h1{margin:0;font:900 italic 2rem/1.05 var(--font);text-transform:uppercase;letter-spacing:.01em;text-shadow:3px 3px 0 var(--inkline),5px 5px 0 var(--c2)}h2{margin:8px 0 0;font:900 italic 1.05rem var(--font);text-transform:uppercase;color:var(--gold);text-shadow:2px 2px 0 var(--inkline)}p{margin:0;color:#e2d4f2}
.logo{font:900 italic clamp(3rem,13vw,4.6rem)/.86 var(--font);text-transform:uppercase;text-align:center;color:var(--ink);-webkit-text-stroke:3px var(--inkline);text-shadow:5px 5px 0 var(--c2),9px 9px 0 var(--inkline);margin:6px 0 2px}.logo span{display:block;color:var(--c1)}.tag{justify-self:center;background:var(--gold);color:#14041a;border:3px solid var(--inkline);padding:3px 12px;font:900 italic .95rem var(--font);text-transform:uppercase;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--inkline)}
.btn{min-height:52px;border-radius:14px;border:3px solid var(--inkline);background:#221036;color:var(--ink);font:800 1.02rem var(--font);padding:6px 18px;box-shadow:4px 4px 0 var(--edge);cursor:pointer}.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--edge)}.btn.main{background:linear-gradient(90deg,var(--c1),var(--c2));color:#14041a;font-weight:900;box-shadow:4px 4px 0 var(--inkline)}.btn[disabled]{opacity:.45}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.row.two{grid-template-columns:1fr 1fr}.row .btn{padding:4px 6px;font-size:.9rem;min-height:46px}.row .btn[aria-pressed=true]{background:#10314a;border-color:var(--c1)}

.fam{color:var(--c1);font:900 italic .85rem var(--font);letter-spacing:.06em;text-transform:uppercase}
.pan{position:relative;margin:0;border:3px solid var(--inkline);border-radius:16px;overflow:hidden;aspect-ratio:840/520;background:#0a0414;box-shadow:5px 5px 0 var(--c1)}.pan:nth-of-type(even){box-shadow:5px 5px 0 var(--c2)}.pan svg{position:absolute;inset:0;width:100%;height:100%}.pan .bub{position:absolute;left:4%;top:6%;max-width:66%;background:#f4ecff;color:#14041a;border:3px solid var(--inkline);border-radius:18px;padding:8px 12px;font:700 .98rem/1.3 var(--font)}.pan.left .bub{left:auto;right:4%}.pan .who{position:absolute;left:10px;bottom:8px;background:var(--gold);color:#14041a;border:2px solid var(--inkline);padding:0 8px;font:900 italic .78rem var(--font);text-transform:uppercase}.pan.left .who{left:auto;right:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--inkline);border-radius:999px;padding:2px 10px 2px 4px;background:#221036;font:800 .85rem var(--font)}.chip i{width:26px;height:10px;border-radius:3px;border:2px solid var(--inkline);background:var(--belt,#f4ecff)}
.stamps{font:900 italic 1.1rem var(--font);color:var(--gold);text-shadow:2px 2px 0 var(--inkline)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.belts{display:grid;gap:8px}.belts div{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:3px solid var(--inkline);border-radius:12px;background:var(--panel)}.belts div i{height:16px;border:2px solid var(--inkline);border-radius:4px;background:var(--belt)}.belts div.no{opacity:.5}
label.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;font-weight:700}label.sw input[type=checkbox]{width:26px;height:26px;accent-color:var(--c2)}label.sw input[type=range]{width:150px;accent-color:var(--c1)}
ul{margin:0;padding-left:1.1em;color:#e2d4f2;display:grid;gap:5px}kbd{border:2px solid var(--edge);border-radius:6px;padding:0 6px;font:700 .85rem var(--font);background:#221036}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.load{font:900 italic 1.4rem var(--font);text-transform:uppercase;text-align:center}
.hud[hidden],.bot[hidden],.bossbar[hidden]{display:none}
.card.wide .grid2{grid-template-columns:1fr 1fr}

.orders{display:grid;gap:4px;font-size:.84rem}.orders span{display:grid;grid-template-columns:1.2em 1fr auto;gap:6px;align-items:baseline}.orders i{font-style:normal;color:var(--mut)}.orders em{font-style:normal;color:var(--gold);font-weight:800}.orders .done{color:#a9ffd4}.orders .done i{color:var(--mint)}

</style></head><body>
<div class="stage" id="stage">
  <aside id="left"><div class="comic port" id="portrait"></div><div class="comic"><h3>The route</h3><div class="route" id="route"></div></div><div class="comic"><h3>Flight orders</h3><div id="ords"></div></div></aside>

</div>
